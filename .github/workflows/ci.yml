name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run check:release

      - name: Validate static site
        run: npm run check:site

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build extension
        run: npm run build

      - name: Start Mattermost test server
        run: npm run mm95:start

      - name: Docker E2E tests
        run: npm run test:e2e

      - name: Stop Mattermost test server
        if: always()
        run: npm run mm95:stop

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  compatibility:
    name: Mattermost ${{ matrix.mattermost }} compatibility
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        mattermost: ["9.5.11", "10.11.22", "11.8.2"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build extension
        run: npm run build

      - name: Start Mattermost ${{ matrix.mattermost }}
        run: node scripts/mm95-start.mjs --version "${{ matrix.mattermost }}"

      - name: Run cross-version compatibility E2E
        run: >
          npx playwright test
          e2e/responsive-rail.spec.ts
          e2e/thread-aware-layout.spec.ts
          e2e/route-change-no-reload.spec.ts
          e2e/team-switch-no-reload.spec.ts
          e2e/mentions-fanout.spec.ts
          e2e/mentions-crt-custom-key.spec.ts
          e2e/mentions-cancellation.spec.ts
          --workers=1

      - name: Stop Mattermost test server
        if: always()
        run: npm run mm95:stop

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.mattermost }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
