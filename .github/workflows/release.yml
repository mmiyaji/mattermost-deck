name: Release Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  compatibility:
    name: Mattermost ${{ matrix.mattermost }} release gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mattermost: ["9.5.11", "10.11.22", "11.8.2"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata and tag
        run: npm run check:release -- "${GITHUB_REF_NAME}"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build extension
        run: npm run build

      - name: Start Mattermost ${{ matrix.mattermost }}
        run: node scripts/mm95-start.mjs --version "${{ matrix.mattermost }}"

      - name: Run cross-version compatibility E2E
        run: >
          npx playwright test
          e2e/responsive-rail.spec.ts
          e2e/thread-aware-layout.spec.ts
          e2e/route-change-no-reload.spec.ts
          e2e/team-switch-no-reload.spec.ts
          --workers=1

      - name: Stop Mattermost test server
        if: always()
        run: npm run mm95:stop

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-compatibility-${{ matrix.mattermost }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

  build-and-release:
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata and tag
        run: npm run check:release -- "${GITHUB_REF_NAME}"

      - name: Validate static site
        run: npm run check:site

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build extension for E2E
        run: npm run build

      - name: Start Mattermost test server
        run: npm run mm95:start

      - name: Docker E2E tests
        run: npm run test:e2e

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-evidence-${{ github.ref_name }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Build store extension
        run: npm run build
        env:
          EXT_VERSION: ${{ github.ref_name }}
          STORE_BUILD: "true"

      - name: Validate store extension
        run: npm run check:store

      - name: Create release archive
        run: |
          cd dist
          zip -r "../mattermost-deck-${GITHUB_REF_NAME}.zip" .
          cd ..
          sha256sum "mattermost-deck-${GITHUB_REF_NAME}.zip" > "mattermost-deck-${GITHUB_REF_NAME}.zip.sha256"
          mkdir release-candidate
          unzip -q "mattermost-deck-${GITHUB_REF_NAME}.zip" -d release-candidate

      - name: Smoke test exact store release candidate
        id: store-smoke
        run: npx playwright test e2e/store-build-smoke.spec.ts --workers=1
        env:
          STORE_BUILD_SMOKE: "true"
          STORE_BUILD_PATH: "release-candidate"

      - name: Stop Mattermost test server
        if: always()
        run: npm run mm95:stop

      - name: Upload store smoke evidence
        if: always() && steps.store-smoke.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: store-smoke-evidence-${{ github.ref_name }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            mattermost-deck-${{ github.ref_name }}.zip
            mattermost-deck-${{ github.ref_name }}.zip.sha256
